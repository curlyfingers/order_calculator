services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GIN_MODE: "release"
    ports:
      - "8080:8080"
    restart: unless-stopped
    expose:
      - 8080

    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
        - action: rebuild
          path: .
          ignore:
            - .gitignore
            - ./client
            - compose.yaml
